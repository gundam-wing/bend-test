<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Frog Wizard</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d0814;
      color: #f2d04a;
      font-family: "Press Start 2P", ui-monospace, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    h1 { font-size: 18px; letter-spacing: 2px; margin: 0; color: #a6f08a; }
    p { font-size: 12px; color: #e8c547; margin: 0; text-align: center; max-width: 520px; line-height: 1.6; }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 512px;
      height: 512px;
      border: 4px solid #6b3fa0;
      box-shadow: 0 0 24px #6b3fa0;
      background: #1a1030;
    }
    .hint { color: #8f7aa0; font-size: 11px; }
  </style>
</head>
<body>
  <h1>FROG WIZARD</h1>
  <p>Walk the swamp and gather <b>12 fly brains</b> before two minutes run out. WASD or arrows to move, R to restart, Esc to quit the native build.</p>
  <canvas id="screen" width="256" height="256"></canvas>
  <p class="hint">Top row: collected brains and the remaining-time bar.</p>
  <script type="module" src="./play.js"></script>
</body>
</html>
