<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frog King</title>
  <style>
    :root {
      --bog: #0c1a12;
      --moss: #2f7a36;
      --lily: #a6f08a;
      --gold: #e8c547;
      --ink: #142018;
      --panel: #1a281c;
      --frame: #4a7a3a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse at 20% 0%, #1a3a28 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #0a2018 0%, transparent 45%),
        linear-gradient(180deg, #08140e 0%, var(--bog) 40%, #06100a 100%);
      color: var(--lily);
      font-family: "Courier New", ui-monospace, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px 12px 28px;
    }
    h1 {
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: 0.18em;
      margin: 0;
      color: var(--lily);
      text-shadow: 0 2px 0 #0a180e;
    }
    .tag {
      margin: 0;
      max-width: 36rem;
      text-align: center;
      color: var(--gold);
      font-size: 13px;
      line-height: 1.55;
    }
    .stage {
      position: relative;
      width: min(96vw, 512px);
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      display: block;
      border: 4px solid var(--frame);
      background: var(--ink);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    #dialogue {
      display: none;
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 4%;
      background: rgba(12, 22, 16, 0.94);
      border: 3px solid var(--gold);
      color: #f4ffe8;
      padding: 12px 14px 10px;
      min-height: 5.5rem;
      font-size: 13px;
      line-height: 1.45;
    }
    #dialogue.show { display: block; }
    #dialogue .who {
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 12px;
    }
    #dialogue .next {
      margin-top: 8px;
      color: #8fbf7a;
      font-size: 11px;
      text-align: right;
    }
    #hud {
      width: min(96vw, 512px);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: #c8e8b0;
    }
    .hint {
      margin: 0;
      color: #7a9a70;
      font-size: 12px;
      text-align: center;
      max-width: 36rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>FROG KING</h1>
  <p class="tag">Walk the realm. Speak with every council seat. Build consensus to rule — and open a new age of grand technological progress.</p>
  <div class="stage">
    <canvas id="screen" width="256" height="256" tabindex="0"></canvas>
    <div id="dialogue" aria-live="polite">
      <div class="who" id="who"></div>
      <div id="line"></div>
      <div class="next">Space / Z / Enter ▸</div>
    </div>
  </div>
  <div id="hud">
    <span id="votes">Council: 0 / 5</span>
    <span id="brains">Brains: 0 / 3</span>
    <span id="place">Lily Pad Village</span>
  </div>
  <p class="hint">WASD / arrows move · Space talk · R restart · cyan pads warp between maps</p>
  <script type="module" src="./play.js"></script>
</body>
</html>
